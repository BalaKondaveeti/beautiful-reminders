<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Goals, deadlines and daily habits." />
    <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try { var a = localStorage.getItem('br-appearance') } catch (e) {}
      document.documentElement.dataset.theme = a === 'dark' || a === 'system' ? a : 'light'
    </script>

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
